server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: đường dẫn không có file thật thì trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File có hash trong tên: cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # MediaPipe runtime (~14 MB WASM) + pose model: tên file không có hash nên không cache cứng.
    # no-cache = trình duyệt vẫn giữ bản cũ nhưng hỏi lại server mỗi lần (ETag) -> không đổi thì chỉ nhận 304.
    # =404 thay vì index.html: thiếu file thì MediaPipe báo lỗi rõ ràng, không nhận nhầm trang HTML.
    location ~ ^/(mediapipe|models)/ {
        try_files $uri =404;
        add_header Cache-Control "public, no-cache";
    }

    # Nén khi gửi: WASM 14 MB còn khoảng một phần ba
    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml application/octet-stream;
    gzip_min_length 1024;

    # index.html: luôn hỏi lại server để thấy bản deploy mới
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}