server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: đường dẫn không có file thật thì trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File có hash trong tên: cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html: luôn hỏi lại server để thấy bản deploy mới
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}