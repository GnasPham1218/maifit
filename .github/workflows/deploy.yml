# .github/workflows/deploy.yml
# Push lên main → build 2 image → push ghcr.io (tag = commit SHA + latest) → SSH vào VPS để deploy.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # cho phép bấm chạy tay trong tab Actions

# Hai lần push liên tiếp → deploy lần lượt, không chạy chồng lên nhau trên VPS
concurrency:
  group: deploy-production
  cancel-in-progress: false

# GITHUB_TOKEN chỉ có đúng các quyền cần dùng
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/gnaspham1218/maifit-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/gnaspham1218/maifit-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"