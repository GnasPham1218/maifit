spring:
  application:
    name: maifit-backend
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2MB     # the frontend resizes photos to ~1024 px JPEG (~200 KB) before upload
      max-request-size: 3MB
  flyway:
    enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}          # Gmail App Password, never the real account password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true   # encrypt the connection
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000 # ms: never hang a thread forever on a slow SMTP server
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}   # override in .env when Google retires a model
            temperature: 0.3
server:
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # otherwise /health connects to Gmail on every check and turns DOWN if Gmail is slow
app:
  rate-limit:
    # Per-email limits, in memory (one backend instance). Per-IP limits are in Nginx.
    max-tracked-keys: 50000   # memory bound per limiter; old keys are evicted beyond this
    login:
      max-attempts: 5         # failed sign-ins per email...
      window: 15m             # ...counted from the first failure, then a lock until the window ends
    password-reset:
      max-attempts: 3         # reset emails per address...
      window: 1h
  food-request:
    daily-limit: 5   # "Báo thiếu món": distinct names per user per day (Vietnam time)
  jwt:
    secret: ${JWT_SECRET}      # Base64, >= 32 bytes; only in .env / GitHub Secrets
    issuer: maifit
    access-token-ttl: 15m
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}   # Vite dev server; prod sets FRONTEND_URL
    verify-token-ttl: 24h
    reset-token-ttl: 30m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}  # set false in local .env only if a tool refuses Secure cookies over HTTP
    refresh-cookie-path: /api/auth
  mail:
    from: ${MAIL_USERNAME}
    from-name: MAIFit
    # Whole app, per day (Vietnam time). Gmail blocks accounts sending ~500/day (rolling 24 h),
    # so stay well below it; normal traffic is a few dozen emails a day.
    daily-limit: 300
  turnstile:
    # Cloudflare Turnstile (CAPTCHA) on register and forgot-password.
    # Local .env uses Cloudflare's test key 1x0000000000000000000000000000000AA (always passes);
    # production uses the real key from the Cloudflare dashboard, only in deploy/.env.
    secret-key: ${TURNSTILE_SECRET_KEY}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    timeout: 5s
  ai:
    daily-limit:
      food-vision: 10   # food recognition calls per user per day
      chat: 20           # chatbot calls per user per day
