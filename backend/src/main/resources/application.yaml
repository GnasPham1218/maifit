spring:
  application:
    name: maifit-backend
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET}      # Base64, >= 32 bytes; only in .env / GitHub Secrets
    issuer: maifit
    access-token-ttl: 15m
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}   # Vite dev server; prod sets FRONTEND_URL
    verify-token-ttl: 24h
    reset-token-ttl: 30m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}  # set false in local .env only if a tool refuses Secure cookies over HTTP
    refresh-cookie-path: /api/auth
