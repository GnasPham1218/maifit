spring:
  application:
    name: maifit-backend
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2MB     # the frontend resizes photos to ~1024 px JPEG (~200 KB) before upload
      max-request-size: 3MB
  flyway:
    enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}          # Gmail App Password, never the real account password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true   # encrypt the connection
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000 # ms: never hang a thread forever on a slow SMTP server
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  ai:
    model:
      # Two providers are on the classpath, so each role is assigned explicitly:
      # Gemini answers, Ollama embeds. Without "chat", Spring finds two ChatModel beans and fails to start.
      chat: google-genai
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: bge-m3           # documents and questions must be embedded by the SAME model
    vectorstore:
      pgvector:
        # Must match vector(1024) in V14__vector_store.sql. Set explicitly so the app does not
        # have to call Ollama at startup to discover it (the app still starts when Ollama is down).
        dimensions: 1024
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}   # override in .env when Google retires a model
            temperature: 0.3
server:
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # otherwise /health connects to Gmail on every check and turns DOWN if Gmail is slow
app:
  rate-limit:
    # Per-email limits, in memory (one backend instance). Per-IP limits are in Nginx.
    max-tracked-keys: 50000   # memory bound per limiter; old keys are evicted beyond this
    login:
      max-attempts: 5         # failed sign-ins per email...
      window: 15m             # ...counted from the first failure, then a lock until the window ends
    password-reset:
      max-attempts: 3         # reset emails per address...
      window: 1h
  rag:
    # Sources are cut at every heading first; a section longer than one chunk is cut again by tokens
    chunk-size: 350        # target tokens per chunk
    min-chunk-chars: 200   # never cut a chunk shorter than this
  chat:
    max-question-chars: 500     # longer questions are rejected (a long question also retrieves worse)
    top-k: 5                    # chunks retrieved and sent to the model
    # Retrieval gate. Measured 2026-11-12 on the 5 sources: in-scope questions 0.56-0.74,
    # out-of-scope 0.28-0.37. Below this score a chunk does not count; no chunk left = refusal, no AI call
    similarity-threshold: 0.45
    food-top-k: 3               # food chunks (one per food name), searched apart from the documents
    # Measured 2026-11-13 (ingest check): food questions 0.62-0.70 on the right food, general nutrition
    # questions 0.46-0.58 on unrelated foods, out of scope 0.29-0.34. Foods named in the question skip it (hybrid)
    food-similarity-threshold: 0.60
    history-messages: 6         # previous messages sent back so follow-up questions make sense
    model-timeout: 30s          # well under Nginx's 60 s: a slow Gemini reply is refunded instead of a silent 504
    # Chat only (photo recognition keeps Gemini's default). Unset: chat-eval 10/15 with calls stuck over 30 s
    # and cut JSON; LOW: 14/15 then 15/15, 1.5-3.5 s per call (2026-11-13). Valid: MINIMAL, LOW, MEDIUM, HIGH
    thinking-level: LOW
  food-request:
    daily-limit: 5   # "Báo thiếu món": distinct names per user per day (Vietnam time)
  jwt:
    secret: ${JWT_SECRET}      # Base64, >= 32 bytes; only in .env / GitHub Secrets
    issuer: maifit
    access-token-ttl: 15m
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}   # Vite dev server; prod sets FRONTEND_URL
    verify-token-ttl: 24h
    reset-token-ttl: 30m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}  # set false in local .env only if a tool refuses Secure cookies over HTTP
    refresh-cookie-path: /api/auth
  mail:
    from: ${MAIL_USERNAME}
    from-name: MAIFit
    # Whole app, per day (Vietnam time). Gmail blocks accounts sending ~500/day (rolling 24 h),
    # so stay well below it; normal traffic is a few dozen emails a day.
    daily-limit: 300
  turnstile:
    # Cloudflare Turnstile (CAPTCHA) on register and forgot-password.
    # Local .env uses Cloudflare's test key 1x0000000000000000000000000000000AA (always passes);
    # production uses the real key from the Cloudflare dashboard, only in deploy/.env.
    secret-key: ${TURNSTILE_SECRET_KEY}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    timeout: 5s
  ai:
    daily-limit:
      food-vision: 3            # food recognition calls per user per day, free plan
      food-vision-premium: 30   # the same for Premium users
      chat: 5                   # chatbot calls per user per day, free plan
      chat-premium: 20          # the same for Premium users
  payment:
    provider: PAYOS             # gateway used for new orders (a PaymentProvider implementation)
    premium:
      # VND for one purchase. Local .env sets PREMIUM_PRICE=2000 for testing: payOS has no sandbox,
      # every test is a real bank transfer.
      price: ${PREMIUM_PRICE:39000}
      days: 30                  # Premium days one purchase adds (stacks on top of the remaining time)
    order-ttl: 15m              # how long a QR stays payable
    max-orders-per-day: 10      # new orders per user per day (Vietnam time)
    description: MAIFit         # bank-transfer content; kept short, gateways limit its length
    return-url: ${FRONTEND_URL:http://localhost:5173}/premium
  payos:
    # Keys of the payOS payment channel (my.payos.vn > Kênh thanh toán). Only in .env / deploy/.env.
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    timeout: 10s
