# deploy/nginx/maifit.conf
# Trên VPS: copy vào /etc/nginx/sites-available/maifit rồi tạo symlink sang sites-enabled.
# Đây là bản HTTP (cổng 80). Certbot (--nginx) sẽ tự thêm khối 443 + chứng chỉ
# và chuyển hướng 80 → 443.

server {
    listen 80;
    listen [::]:80;
    server_name maifit.gnaspham1218.dev;

    client_max_body_size 10m;   # giới hạn upload (ảnh bữa ăn)

    # /api/... → container backend (giữ nguyên tiền tố /api vì controller đã có /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mọi đường dẫn còn lại → container frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Nginx này chạy THẲNG trên VPS (không nằm trong mạng Docker),
# nên nó gọi container qua cổng đã publish ở 127.0.0.1, không gọi được "backend:8080".