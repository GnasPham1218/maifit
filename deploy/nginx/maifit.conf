# deploy/nginx/maifit.conf
# FULL config running on the VPS (including the HTTPS part added by certbot).
# On the VPS: /etc/nginx/sites-available/maifit (symlinked into sites-enabled).
# Edit this file in the repo first, then copy it to the VPS:
#   sudo cp ~/maifit/deploy/nginx/maifit.conf /etc/nginx/sites-available/maifit
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx.conf includes this file INSIDE its http { } block, so the directives
# outside server { } below are http-level settings (they apply to every server).

# ---------------- HTTP LEVEL ----------------

# server_tokens is NOT set here: Ubuntu's /etc/nginx/nginx.conf already sets
# "server_tokens build;" at http level, and a second one at the same level fails nginx -t
# ("directive is duplicate"). It is set inside each server block below instead,
# which overrides the http-level value.

# Rate-limit counters, keyed by the client IP that Nginx sees directly
# ($binary_remote_addr cannot be spoofed with a header). 10m of memory ~ 160,000 IPs.
#  - auth: endpoints targeted by brute force / email spam -> 5 requests per minute
#  - api : every other API -> 10 requests per second (the meal calendar page calls several APIs at once)
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
limit_req_status 429;   # the default is 503 ("server broken"), which has the wrong meaning

# ---------------- HTTPS ----------------
server {
    listen 443 ssl;                     # managed by Certbot
    listen [::]:443 ssl ipv6only=on;    # managed by Certbot
    server_name maifit.gnaspham1218.dev;

    # Do not put the version number in the "Server" header and error pages
    # (attackers cannot look up CVEs for our exact version)
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/maifit.gnaspham1218.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maifit.gnaspham1218.dev/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                 # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                   # managed by Certbot

    # Spring allows 2 MB per file / 3 MB per request; reject bigger requests here
    # so they never reach the backend
    client_max_body_size 4m;

    # ---- Security headers ----
    # "always": also added to error responses (404, 429, 500), not only 2xx/3xx.
    # TRAP: a location with its own add_header LOSES ALL the headers below
    # (Nginx only inherits add_header when the child block has none).
    # -> Do not write add_header inside the locations below.

    # HSTS: 1 year. certbot.timer renews the certificate automatically (verified with renew --dry-run)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Camera only for MAIFit itself (rep counting); every unused permission is turned off
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), usb=()" always;
    # Clickjacking protection for old browsers; modern ones use frame-ancestors in the CSP below
    add_header X-Frame-Options "DENY" always;
    # CSP (enforced). Was Report-Only first; the only violation found was MediaPipe telemetry
    # to odml.pa.googleapis.com, which is intentionally blocked: rep counting runs fully in the browser.
    #  - 'wasm-unsafe-eval': MediaPipe runs WebAssembly
    #  - blob: meal photo previews (URL.createObjectURL), MediaPipe workers if any
    #  - connect-src 'self': an injected script (if XSS ever gets through) cannot send tokens elsewhere
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Spring Security adds these headers too -> drop Spring's copies so they are not duplicated;
    # Nginx is the single place that manages security headers. (Spring's Cache-Control is KEPT.)
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;

    # Headers sent to the containers (shared by every location with proxy_pass).
    # Nginx OVERWRITES X-Real-IP with the real client IP -> the backend trusts this header (step 2),
    # never X-Forwarded-For, which the client can fill in itself
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rate-limited request -> JSON in the ApiResponse format
    # (the frontend maps code TOO_MANY_REQUESTS to a Vietnamese message)
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"success":false,"code":"TOO_MANY_REQUESTS","message":"Too many requests"}';
    }

    # ---- API: auth endpoints that attackers target -> strict limit ----
    # ONLY these endpoints. NOT /auth/refresh, /auth/me, /auth/logout:
    # the frontend calls refresh on every page load -> with a shared 5/minute limit,
    # a user pressing F5 a few times would get 429 and be logged out.
    location ~ ^/api/auth/(login|register|forgot-password|reset-password|verify-email)$ {
        limit_req zone=auth burst=5 nodelay;   # 5 requests in a row are allowed, then 1 every 12 seconds
        proxy_pass http://127.0.0.1:8080;
    }

    # ---- Every other API ----
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # ---- Frontend (static files, no rate limit) ----
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# ---------------- HTTP -> HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name maifit.gnaspham1218.dev;
    server_tokens off;

    if ($host = maifit.gnaspham1218.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}

# This Nginx runs DIRECTLY on the VPS (not inside the Docker network),
# so it reaches the containers through the ports published on 127.0.0.1;
# it cannot call "backend:8080".