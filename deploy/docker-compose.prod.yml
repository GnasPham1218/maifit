# deploy/docker-compose.prod.yml
# Chạy trên VPS bằng: docker compose -f docker-compose.prod.yml --env-file .env up -d
# File .env nằm cùng thư mục trên VPS (KHÔNG commit lên git).

services:

  # ---------------- DATABASE ----------------
  db:
    # Cùng image + tag với docker-compose.yml ở máy dev → dev và prod chạy cùng phiên bản Postgres
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data   # dữ liệu nằm ngoài container, xoá container không mất DB
    healthcheck:
      # $$ = để Compose không tự thay biến; biến được đọc BÊN TRONG container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Chỉ VPS thấy cổng này (cho SSH tunnel); Internet không gọi được
      - "127.0.0.1:5432:5432"
    

  # ---------------- BACKEND ----------------
  backend:
    image: ghcr.io/${GHCR_OWNER}/maifit-backend:${IMAGE_TAG}
    restart: unless-stopped
    # Giới hạn RAM container → JVM tính MaxRAMPercentage=75 trên 768m (~576m heap),
    # chừa RAM cho Postgres và hệ điều hành trên VPS 2 GB
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy        # chờ Postgres sẵn sàng rồi mới chạy (Flyway cần DB)
    environment:
      # Trong mạng Docker gọi DB bằng TÊN SERVICE "db", không phải localhost
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Auth: ":?" makes Compose refuse to start if the variable is missing or empty in .env,
      # with a clear message, instead of starting a backend that crashes
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in deploy/.env}
      MAIL_USERNAME: ${MAIL_USERNAME:?set MAIL_USERNAME in deploy/.env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in deploy/.env}
      # AI: the key is required; the model falls back to the default in application.yaml.
      # ":-" (not an empty value) because Spring treats an empty GEMINI_MODEL as set and skips its default
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in deploy/.env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Chat only (photo recognition uses GEMINI_MODEL)
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.1-flash-lite}
      # CAPTCHA (Cloudflare Turnstile) secret key, checked server-side on register and forgot-password
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY in deploy/.env}
      # Payments (payOS): keys of the payment channel. The checksum key is what proves a webhook is real.
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:?set PAYOS_CLIENT_ID in deploy/.env}
      PAYOS_API_KEY: ${PAYOS_API_KEY:?set PAYOS_API_KEY in deploy/.env}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:?set PAYOS_CHECKSUM_KEY in deploy/.env}
      # Price of Premium in VND; ":-" for the same reason as GEMINI_MODEL
      PREMIUM_PRICE: ${PREMIUM_PRICE:-29999}
      # RAG embeddings (bge-m3): call Ollama by its service name inside the Docker network
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      # 127.0.0.1 : 8080         : 8080
      # chỉ VPS   : cổng trên VPS : cổng trong container
      # → Nginx trên VPS gọi http://127.0.0.1:8080, Internet KHÔNG gọi được
      - "127.0.0.1:8080:8080"

  # ---------------- OLLAMA (embeddings for the chatbot) ----------------
  ollama:
    # Pinned version: "latest" could change the embedding runtime under us on any restart
    image: ollama/ollama:0.40.14
    restart: unless-stopped
    # bge-m3 needs ~1.2 GB; the cap keeps Postgres and the backend safe if Ollama misbehaves
    mem_limit: 1536m
    environment:
      OLLAMA_KEEP_ALIVE: "-1"         # keep the model in RAM: no multi-second reload on the first question
      OLLAMA_MAX_LOADED_MODELS: "1"   # only bge-m3 ever runs here
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time: less RAM, fine for embedding short questions
    volumes:
      - ollama:/root/.ollama          # downloaded models survive container re-creation
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
    # No "ports": only containers on this network (the backend) can reach 11434

  # ---------------- FRONTEND ----------------
  frontend:
    image: ghcr.io/${GHCR_OWNER}/maifit-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      # Trong container Nginx-unprivileged nghe 8080 (trùng số với backend nhưng
      # là container khác nên không đụng nhau). Trên VPS nối ra cổng 3000.
      - "127.0.0.1:3000:8080"

volumes:
  pgdata:
  ollama:

# Docker Compose tự tạo một mạng nội bộ cho 4 service trên.
# Trong mạng đó: "db", "backend", "ollama", "frontend" là tên máy (DNS nội bộ).
#
# SAI — tuyệt đối không viết:  ports: - "8080:8080"
#   → cổng mở ra MỌI địa chỉ, Internet gọi thẳng được, và đi vòng qua ufw.